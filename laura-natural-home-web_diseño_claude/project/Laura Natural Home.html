<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Natural Home · Diseño de interiores en Valencia</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<link rel="stylesheet" href="src/kit-styles.css">
<link rel="stylesheet" href="src/extra-styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/Atoms.jsx"></script>
<script type="text/babel" src="src/Chrome.jsx"></script>
<script type="text/babel" src="src/Home.jsx"></script>
<script type="text/babel" src="src/PagesAboutServices.jsx"></script>
<script type="text/babel" src="src/PagesPortfolioBlog.jsx"></script>
<script type="text/babel" src="src/PagesContact.jsx"></script>

<script type="text/babel">
  const { LNH_Nav, LNH_Footer, LNH_useRoute,
          LNH_Home, LNH_About,
          LNH_ServicesHub, LNH_ServiceDetail,
          LNH_Portfolio, LNH_ProjectDetail,
          LNH_Blog, LNH_PostDetail,
          LNH_Contact } = window;

  function App() {
    const parts = LNH_useRoute();
    let page;
    const root = parts[0];

    if (!root) page = <LNH_Home />;
    else if (root === "sobre-mi") page = <LNH_About />;
    else if (root === "servicios") {
      page = parts[1] ? <LNH_ServiceDetail slug={parts[1]} /> : <LNH_ServicesHub />;
    }
    else if (root === "portafolio") {
      page = parts[1] ? <LNH_ProjectDetail slug={parts[1]} /> : <LNH_Portfolio />;
    }
    else if (root === "blog") {
      page = parts[1] ? <LNH_PostDetail slug={parts[1]} /> : <LNH_Blog />;
    }
    else if (root === "contacto") page = <LNH_Contact />;
    else page = <LNH_Home />;

    return (
      <div className="lnh-app">
        <LNH_Nav parts={parts} />
        {page}
        <LNH_Footer />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
